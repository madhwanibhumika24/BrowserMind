<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BrowserMind Forms</title>
  <link rel="stylesheet" href="form-generator.css" />
</head>
<body>
  <div class="bg-dots"></div>
  <div id="forms-app">
    <header>
      <div class="logo-wrap">
        <img class="forms-logo" src="../../public/icons/icon48.png" alt="" />
        <span class="decor-badge decor-1">📋</span>
      </div>
      <div class="forms-heading">
        <span class="hero-tag">✨ AI-powered, in seconds</span>
        <h1>Create <span class="text-gradient">quizzes, surveys</span> &amp; forms<span class="decor-star">✦</span></h1>
        <p class="forms-subtitle">Describe what you need, and BrowserMind writes the questions - you get a link anyone can open and answer.</p>
      </div>
    </header>

    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="quiz">Quiz generator</button>
      <button class="mode-tab" data-mode="survey">Survey generator</button>
      <button class="mode-tab" data-mode="document">Document to form</button>
    </div>

    <div id="generate-card">
      <div id="text-input-block">
        <label for="form-description" id="description-label">What should this quiz test?</label>
        <textarea id="form-description" rows="4" placeholder="e.g. 20 questions on Java fundamentals - variables, loops, OOP, exceptions"></textarea>
      </div>

      <div id="document-input-block" class="hidden">
        <label for="form-file">Upload a document</label>
        <label id="dropzone" for="form-file">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <span id="dropzone-text">Click to upload</span>
          <span class="dropzone-hint">Supports PDF and Word (.docx)</span>
        </label>
        <input id="form-file" type="file" accept=".pdf,.docx" class="hidden" />

        <div class="options-row" id="doc-kind-row">
          <label class="inline-label">Generate as</label>
          <div class="kind-toggle">
            <button type="button" class="kind-opt active" data-kind="quiz">Quiz</button>
            <button type="button" class="kind-opt" data-kind="survey">Survey</button>
          </div>
        </div>
      </div>

      <div class="options-row">
        <label class="inline-label" for="question-count">Number of questions</label>
        <select id="question-count">
          <option value="0">Auto</option>
          <option value="5">5</option>
          <option value="10">10</option>
          <option value="15">15</option>
          <option value="20">20</option>
          <option value="25">25</option>
        </select>
      </div>
      <button id="generate-btn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 2l1.8 5.6L19 9l-5.2 1.6L12 16l-1.8-5.4L5 9l5.2-1.4L12 2z"/></svg>
        Generate form
      </button>
      <p id="generate-error" class="hidden"></p>
    </div>

    <div id="examples-section">
      <p class="examples-label">Try an example</p>
      <div class="examples-grid">
        <button class="example-chip" data-mode="survey" data-desc="A short feedback survey for my college class about this week's lecture, asking about clarity, pace, and which topics need more review.">
          <span class="example-icon" style="background:rgba(108,92,231,0.16); color:#a78bfa;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-4"/></svg>
          </span>
          Class feedback survey
        </button>
        <button class="example-chip" data-mode="survey" data-desc="A quick poll to find the best day and time for my study group to meet each week.">
          <span class="example-icon" style="background:rgba(63,169,245,0.16); color:#7dd3fc;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="4"/><path d="M2 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></svg>
          </span>
          Study group poll
        </button>
        <button class="example-chip" data-mode="quiz" data-desc="20 quiz questions testing knowledge of Java fundamentals: variables, loops, OOP basics, and exceptions.">
          <span class="example-icon" style="background:rgba(62,207,142,0.16); color:#6ee7b7;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
          </span>
          Java fundamentals quiz
        </button>
        <button class="example-chip" data-mode="quiz" data-desc="15 quiz questions on World War 2 history for exam revision, covering key events, dates, and figures.">
          <span class="example-icon" style="background:rgba(224,92,92,0.16); color:#f87171;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
          </span>
          Exam revision quiz
        </button>
        <button class="example-chip" data-mode="survey" data-desc="An RSVP form for a college tech club event, asking if people are attending, dietary preferences, and any questions.">
          <span class="example-icon" style="background:rgba(224,150,92,0.16); color:#fbbf24;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          </span>
          Event RSVP form
        </button>
      </div>
    </div>

    <div id="result-card" class="hidden">
      <div class="result-title-row">
        <span class="result-check">✓</span>
        <h2 id="result-title"></h2>
      </div>
      <p class="forms-subtitle" id="result-desc"></p>

      <label>Shareable link</label>
      <div class="link-row">
        <input id="share-link" type="text" readonly />
        <button id="copy-link-btn">Copy</button>
      </div>
      <a id="open-link-btn" class="btn-secondary" target="_blank" rel="noopener">Open form</a>

      <div class="responses-section">
        <div class="responses-header">
          <span>Responses (<span id="response-count">0</span>)</span>
          <button id="refresh-responses-btn" title="Refresh">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg>
          </button>
        </div>
        <div id="responses-list"></div>
      </div>

      <button id="new-form-btn" class="btn-secondary">Create another form</button>
    </div>
  </div>
  <script type="module" src="form-generator.js"></script>
</body>
</html>
