<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BrowserMind Document Chat</title>
  <link rel="stylesheet" href="../shared/tokens.css" />
  <link rel="stylesheet" href="../shared/components.css" />
  <link rel="stylesheet" href="document-chat.css" />
</head>
<body class="doc-body">
  <div class="bg-dots"></div>
  <div id="doc-app">
    <aside class="doc-sidebar" id="doc-history">
      <div class="doc-sidebar-brand">
        <img src="../../public/icons/icon48.png" alt="" />
        <span>BrowserMind</span>
        <button type="button" id="back-to-app-btn" class="doc-back-btn" title="Back to BrowserMind">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></svg>
          Back
        </button>
      </div>

      <button type="button" id="new-chat-btn" class="doc-new-chat">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        New chat
      </button>

      <div class="doc-sidebar-label">Chats</div>
      <div id="doc-history-list" class="doc-history-list"></div>

      <div id="sidebar-resize-handle" class="doc-sidebar-resize" title="Drag to resize"></div>
    </aside>

    <main class="doc-main">
      <div class="doc-static-topbar">Chat with Document</div>

      <div id="upload-view" class="doc-empty-state">
        <div class="doc-empty-glow"></div>
        <img class="doc-empty-logo" src="../../public/icons/icon48.png" alt="" />
        <h1>Chat with <span class="text-gradient">Document</span></h1>
        <p class="doc-empty-subtitle">Upload a PDF, Word, or PowerPoint file and ask questions - BrowserMind answers using only what's in it.</p>

        <div class="tool-card doc-upload-card">
          <label id="doc-dropzone" for="doc-file-input" class="dropzone">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            <span id="doc-dropzone-text">Click to upload</span>
            <span class="dropzone-hint">PDF, Word (.docx), or PowerPoint (.pptx) - select multiple to chat across all of them</span>
          </label>
          <input id="doc-file-input" type="file" accept=".pdf,.docx,.pptx" multiple class="hidden" />
          <div id="doc-file-list"></div>

          <button id="upload-btn" class="primary-btn">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 2l1.8 5.6L19 9l-5.2 1.6L12 16l-1.8-5.4L5 9l5.2-1.4L12 2z"/></svg>
            Start chatting
          </button>
          <p id="upload-error" class="tool-error hidden"></p>
        </div>
      </div>

      <div id="chat-view" class="doc-chat hidden">
        <div class="doc-chat-topbar">
          <span class="doc-filename-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          </span>
          <span class="doc-filename" id="doc-filename"></span>
          <div class="doc-scope-wrap hidden" id="doc-scope-wrap">
            <label for="doc-scope-select">Answering from</label>
            <select id="doc-scope-select">
              <option value="__all__">All documents</option>
            </select>
          </div>
          <div class="doc-chat-topbar-actions">
            <button type="button" id="summarize-btn" class="doc-quick-btn">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M3 12h3M18 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
              Summarize
            </button>
            <button id="change-doc-btn" class="back-link">Change document</button>
          </div>
        </div>

        <div id="chat-log" class="doc-chat-log"></div>

        <div class="doc-chat-inputbar">
          <div class="doc-chat-input-inner">
            <input id="chat-input" type="text" placeholder="Ask a question about this document..." />
            <button id="send-btn" title="Send">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 20l18-8L3 4v6l12 2-12 2z"/></svg>
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script type="module" src="document-chat.js"></script>
</body>
</html>
